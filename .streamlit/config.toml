# App look: a deep royal-blue livery with bright blue, sky blue, white and a red accent.
# Light and dark both defined; viewers can switch in the app's Settings menu.

[theme]
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "small"

[theme.light]
primaryColor = "#1f56c9"
linkColor = "#1f56c9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3fb"
textColor = "#0f1a2e"
borderColor = "#d3ddef"

[theme.dark]
primaryColor = "#7cc7ff"
linkColor = "#7cc7ff"
backgroundColor = "#0d1320"
secondaryBackgroundColor = "#16203a"
textColor = "#eef2f8"
borderColor = "#2a3756"
