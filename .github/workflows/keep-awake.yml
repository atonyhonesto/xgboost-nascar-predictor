# Opens the Streamlit app in a headless browser every 6 hours so it doesn't go to
# sleep (free Community Cloud apps sleep after ~12 hours without visitors).
# If the app is already asleep, it clicks the wake-up button and waits for it to load.
# Run it by hand from the Actions tab with "Run workflow".
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at minute 17 (UTC)
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://xgboost-nascar-predictor.streamlit.app/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=120_000)
              page.wait_for_timeout(10_000)

              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep - waking it up.")
                  wake.click()

              # The app itself runs inside an iframe at /~/+/.
              for _ in range(24):  # up to 4 minutes
                  app = next((f for f in page.frames if "/~/+/" in f.url), None)
                  try:
                      if app and "XGBoost NASCAR Predictor" in app.inner_text("body"):
                          print("App is awake and rendering.")
                          break
                  except Exception:
                      pass
                  page.wait_for_timeout(10_000)
              else:
                  raise SystemExit("App did not finish loading - check Manage app logs.")
